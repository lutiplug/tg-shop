<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneMarket Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --hint-color: #888888;
            --btn-color: #ffffff;
            --btn-text: #000000;
            --card-bg: #111111;
            --border-color: #222222;
            --input-bg: #111111;
            --toggle-bg: #1c1c1e;
            --toggle-thumb: #2c2c2e;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #666666;
            --btn-color: #000000;
            --btn-text: #ffffff;
            --card-bg: #f4f4f5;
            --border-color: #e4e4e7;
            --input-bg: #f4f4f5;
            --toggle-bg: #e4e4e7;
            --toggle-thumb: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 160px; /* Большой отступ снизу, чтобы контент не перекрывался */
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .theme-switch-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .theme-toggle {
            position: relative;
            width: 76px;
            height: 38px;
            background: var(--toggle-bg);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 39px;
            width: 32px;
            height: 30px;
            background: var(--toggle-thumb);
            border-radius: 999px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        }

        body.light-theme .toggle-thumb {
            transform: translateX(-35px);
        }

        .toggle-icon {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
        }

        body:not(.light-theme) .icon-moon { color: #ffffff; }
        body.light-theme .icon-sun { color: #000000; }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        .search-container { margin-bottom: 14px; }

        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--card-bg);
            color: var(--hint-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--btn-color);
            color: var(--btn-text);
            border-color: var(--btn-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .card-price { color: var(--hint-color); font-weight: 700; font-size: 15px; margin-bottom: 12px; }

        .btn-add {
            background: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }

        .cart-items-list {
            margin-top: 24px;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-item-row:last-child { border-bottom: none; }

        .counter-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-color);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            background: var(--btn-color);
            color: var(--btn-text);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Корзина поднята выше, чтобы не перекрывать нижнюю навигацию */
        .cart-bar {
            position: fixed;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 40;
        }

        .btn-checkout {
            background: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .empty-search {
            text-align: center;
            color: var(--hint-color);
            padding: 20px 0;
            font-size: 14px;
        }

        /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (LIQUID GLASS) — ПОВЕРХ ВСЕГО */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 16px;
            right: 16px;
            height: 62px;
            background: rgba(25, 25, 28, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 99999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        body.light-theme .bottom-nav {
            background: rgba(244, 244, 245, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            height: 100%;
            flex: 1;
            padding: 0;
        }

        .nav-item span:first-child { font-size: 20px; }
        .nav-item.active { color: var(--text-color); }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
            <div class="toggle-thumb"></div>
            <div class="toggle-icon icon-sun">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                </svg>
            </div>
            <div class="toggle-icon icon-moon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 1: МАГАЗИН -->
    <div id="shop-content">
        <div class="header">
            <h2>OneMarket</h2>
            <p>Магазин цифровых товаров</p>
            <button class="btn-add" style="width: 100%; margin-top: 10px;" onclick="triggerScreamer()">🎁 Получить секретную скидку</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Найти товар..." oninput="renderProducts()">
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="filterCategory('all', this)">Все товары</button>
            <button class="tab-btn" onclick="filterCategory('premium', this)">👑 Premium</button>
            <button class="tab-btn" onclick="filterCategory('stars', this)">⭐️ Stars</button>
            <button class="tab-btn" onclick="filterCategory('steam', this)">🎮 Steam</button>
        </div>

        <div id="premium-section">
            <div class="section-title">👑 Telegram Premium</div>
            <div class="grid" id="premium-grid"></div>
        </div>

        <div id="stars-section">
            <div class="section-title">⭐️ Telegram Stars</div>
            <div class="grid" id="stars-grid"></div>
        </div>

        <div id="steam-section">
            <div class="section-title">🎮 Пополнение Steam</div>
            <div class="grid" id="steam-grid"></div>
        </div>

        <div id="no-results" class="empty-search" style="display: none;">Товары не найдены 🔍</div>

        <div id="cart-section" class="cart-items-list" style="display:none;">
            <div style="font-size: 15px; font-weight:700; margin-bottom: 10px;">🛒 Выбранные товары:</div>
            <div id="cart-items-container"></div>
        </div>

        <div class="cart-bar">
            <div>
                <div style="font-size: 12px; color: var(--hint-color);" id="total-count">Товаров: 0</div>
                <div style="font-size: 18px; font-weight: 800;" id="total-price">0 ₽</div>
            </div>
            <button class="btn-checkout" onclick="checkoutOrder()">Оформить</button>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ИГРЫ -->
    <div id="games-content" style="display: none;"></div>

    <!-- ВКЛАДКА 3: ЛУДКА -->
    <div id="roulette-content" style="display: none; text-align: center; padding-top: 40px;">
        <h3>🎰 Колесо удачи</h3>
        <p style="color: var(--hint-color); font-size: 13px;">Скоро здесь появится рулетка!</p>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <button type="button" class="nav-item active" id="nav-shop" onclick="switchTab('shop')">
            <span>🛍</span>
            <span>Магазин</span>
        </button>
        <button type="button" class="nav-item" id="nav-games" onclick="switchTab('games')">
            <span>🎮</span>
            <span>Игры</span>
        </button>
        <button type="button" class="nav-item" id="nav-roulette" onclick="switchTab('roulette')">
            <span>🎰</span>
            <span>Лудка</span>
        </button>
    </div>

    <!-- СКРИМЕР -->
    <audio id="horseAudio" src="mixkit-scared-horse-neighing-85.wav" preload="auto"></audio>
    <div id="screamerModal" onclick="this.style.display='none'" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100000; justify-content: center; align-items: center;">
        <img src="horse.jpg" onerror="this.src='IMAGE 2026-11-21 23:09:51.jpg'" style="max-width: 90%; max-height: 90%; border-radius: 12px;">
    </div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
            }
        }

        // 1. ТЕМА
        function applyTheme(isLight) {
            if (isLight) {
                document.body.classList.add('light-theme');
                if (tg && tg.setHeaderColor) tg.setHeaderColor('#ffffff');
                if (tg && tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
            } else {
                document.body.classList.remove('light-theme');
                if (tg && tg.setHeaderColor) tg.setHeaderColor('#000000');
                if (tg && tg.setBackgroundColor) tg.setBackgroundColor('#000000');
            }
        }

        function toggleTheme() {
            triggerHaptic();
            const isLight = !document.body.classList.contains('light-theme');
            applyTheme(isLight);
            localStorage.setItem('onemarket_theme', isLight ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('onemarket_theme') === 'light');

        // 2. МАГАЗИН
        const products = [
            { id: 'stars_50', name: '50 Звёзд ⭐️', price: 18, type: 'stars' },
            { id: 'stars_75', name: '75 Звёзд ⭐️', price: 27, type: 'stars' },
            { id: 'stars_100', name: '100 Звёзд ⭐️', price: 35, type: 'stars' },
            { id: 'stars_150', name: '150 Звёзд ⭐️', price: 52, type: 'stars' },
            { id: 'stars_250', name: '250 Звёзд ⭐️', price: 87, type: 'stars' },
            { id: 'stars_300', name: '300 Звёзд ⭐️', price: 104, type: 'stars' },
            { id: 'stars_500', name: '500 Звёзд ⭐️', price: 165, type: 'stars' },
            { id: 'prem_1', name: 'Premium 1 мес. (с заходом)', price: 75, type: 'premium' },
            { id: 'prem_3', name: 'Premium 3 мес.', price: 230, type: 'premium' },
            { id: 'prem_6', name: 'Premium 6 мес.', price: 320, type: 'premium' },
            { id: 'prem_12', name: 'Premium 12 мес.', price: 500, type: 'premium' },
            { id: 'steam_1', name: 'Пополнение Steam $1', price: 21, type: 'steam' },
            { id: 'steam_5', name: 'Пополнение Steam $5', price: 100, type: 'steam' },
            { id: 'steam_10', name: 'Пополнение Steam $10', price: 190, type: 'steam' },
        ];

        let cart = {};
        let currentCategory = 'all';

        function filterCategory(category, btnElement) {
            triggerHaptic();
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderProducts();
        }

        function renderProducts() {
            const searchInput = document.getElementById('searchInput');
            const searchQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
            
            const premContainer = document.getElementById('premium-grid');
            const starsContainer = document.getElementById('stars-grid');
            const steamContainer = document.getElementById('steam-grid');

            if (!premContainer) return;

            premContainer.innerHTML = '';
            starsContainer.innerHTML = '';
            steamContainer.innerHTML = '';

            let premCount = 0, starsCount = 0, steamCount = 0;

            products.forEach(p => {
                const matchesCategory = (currentCategory === 'all' || p.type === currentCategory);
                const matchesSearch = p.name.toLowerCase().includes(searchQuery);

                if (matchesCategory && matchesSearch) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">${p.price} ₽</div>
                        <button class="btn-add" onclick="addToCart('${p.id}')">В корзину</button>
                    `;
                    if (p.type === 'premium') { premContainer.appendChild(card); premCount++; }
                    else if (p.type === 'stars') { starsContainer.appendChild(card); starsCount++; }
                    else if (p.type === 'steam') { steamContainer.appendChild(card); steamCount++; }
                }
            });

            document.getElementById('premium-section').style.display = (premCount > 0 && (currentCategory === 'all' || currentCategory === 'premium')) ? 'block' : 'none';
            document.getElementById('stars-section').style.display = (starsCount > 0 && (currentCategory === 'all' || currentCategory === 'stars')) ? 'block' : 'none';
            document.getElementById('steam-section').style.display = (steamCount > 0 && (currentCategory === 'all' || currentCategory === 'steam')) ? 'block' : 'none';
            document.getElementById('no-results').style.display = (premCount === 0 && starsCount === 0 && steamCount === 0) ? 'block' : 'none';
        }

        function addToCart(id) {
            triggerHaptic();
            if (cart[id]) cart[id].count += 1;
            else cart[id] = { ...products.find(p => p.id === id), count: 1 };
            updateCartUI();
        }

        function changeQty(id, delta) {
            triggerHaptic();
            if (!cart[id]) return;
            cart[id].count += delta;
            if (cart[id].count <= 0) delete cart[id];
            updateCartUI();
        }

        function updateCartUI() {
            let totalPrice = 0, totalCount = 0;
            const items = Object.values(cart);
            document.getElementById('cart-section').style.display = items.length > 0 ? 'block' : 'none';
            const cartContainer = document.getElementById('cart-items-container');
            cartContainer.innerHTML = '';

            items.forEach(item => {
                totalPrice += item.price * item.count;
                totalCount += item.count;
                cartContainer.innerHTML += `
                    <div class="cart-item-row">
                        <div>
                            <str
