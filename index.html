<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneMarket Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --btn-color: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #999999);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px;
            border-bottom: 2px solid var(--btn-color);
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .card-price {
            color: var(--hint-color);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .btn-add, .btn-qty {
            background-color: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .counter-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-qty {
            padding: 4px 10px;
            font-size: 14px;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-checkout {
            background-color: #30b455;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        /* Список товаров в корзине */
        .cart-items-list {
            margin-top: 20px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            padding-top: 10px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <h2>OneMarket</h2>

    <div class="section-title">⭐ Telegram Premium</div>
    <div class="grid" id="premium-grid"></div>

    <div class="section-title">✨ Telegram Stars</div>
    <div class="grid" id="stars-grid"></div>

    <div id="cart-section" class="cart-items-list" style="display:none;">
        <div class="section-title">🛒 Ваши выбранные товары</div>
        <div id="cart-items-container"></div>
    </div>

    <div style="height: 70px;"></div>

    <div class="cart-bar">
        <div>
            <div>Итого: <strong id="total-price">0 ₽</strong></div>
            <div style="font-size: 12px; color: var(--hint-color);" id="total-count">Товаров: 0</div>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Оформить заказ</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
