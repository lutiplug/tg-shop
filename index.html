<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OneMarket Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --hint-color: #888888;
            --btn-color: #ffffff;
            --btn-text: #000000;
            --card-bg: #111111;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 95px;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        /* Поле поиска */
        .search-container {
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            background: #111111;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--hint-color);
        }

        /* Вкладки категорий */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #111111;
            color: var(--hint-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 20px 0 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .card:active {
            transform: scale(0.96);
            border-color: #444444;
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-price {
            color: var(--hint-color);
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .btn-add {
            background: var(--btn-color);
            color: var(--btn-text);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-add:active {
            opacity: 0.8;
        }

        /* Выбранная корзина */
        .cart-items-list {
            margin-top: 24px;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-row:last-child {
            border-bottom: none;
        }

        .counter-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #000000;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            background: var(--btn-color);
            color: var(--btn-text);
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #111111;
            border: 1px solid #333333;
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .btn-checkout {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }

        .btn-checkout:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .empty-search {
            text-align: center;
            color: var(--hint-color);
            padding: 20px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>OneMarket</h2>
        <p>Магазин цифровых товаров</p>
    </div>

    <!-- Строка поиска -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Найти товар..." oninput="handleSearch()">
    </div>

    <!-- Вкладки категорий -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="filterCategory('all', this)">Все товары</button>
        <button class="tab-btn" onclick="filterCategory('premium', this)">👑 Premium</button>
        <button class="tab-btn" onclick="filterCategory('stars', this)">⭐️ Stars</button>
        <button class="tab-btn" onclick="filterCategory('steam', this)">🎮 Steam</button>
    </div>

    <!-- Контейнеры товаров -->
    <div id="premium-section">
        <div class="section-title">👑 Telegram Premium</div>
        <div class="grid" id="premium-grid"></div>
    </div>

    <div id="stars-section">
        <div class="section-title">⭐️ Telegram Stars</div>
        <div class="grid" id="stars-grid"></div>
    </div>

    <div id="steam-section">
        <div class="section-title">🎮 Пополнение Steam</div>
        <div class="grid" id="steam-grid"></div>
    </div>

    <div id="no-results" class="empty-search" style="display: none;">Товары не найдены 🔍</div>

    <!-- Корзина -->
    <div id="cart-section" class="cart-items-list" style="display:none;">
        <div style="font-size: 15px; font-weight:700; margin-bottom: 10px;">🛒 Выбранные товары:</div>
        <div id="cart-items-container"></div>
    </div>

    <div class="cart-bar">
        <div>
            <div style="font-size: 12px; color: var(--hint-color);" id="total-count">Товаров: 0</div>
            <div style="font-size: 18px; font-weight: 800;" id="total-price">0 ₽</div>
        </div>
        <button class="btn-checkout" id="checkoutBtn">Оформить</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
