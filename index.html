<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин цифровых товаров</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px; /* Отступ под фиксированную кнопку */
        }

        h1 {
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .product-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .product-info p {
            margin: 0;
            font-size: 14px;
            color: var(--hint-color);
        }

        .product-action {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        /* Корзина (нижняя панель) */
        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            border-top: 1px solid var(--secondary-bg);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }

        .cart-info {
            font-size: 15px;
            font-weight: 500;
        }

        .btn-checkout {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-checkout:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🛍 Каталог товаров</h1>
    
    <!-- Сюда JavaScript автоматически загрузит товары -->
    <div class="products-grid" id="products-container"></div>

    <!-- Панель корзины -->
    <div class="cart-footer">
        <div class="cart-info" id="cart-info">Корзина пуста</div>
        <button class="btn-checkout" id="checkout-btn" onclick="checkout()" disabled>Оформить заказ</button>
    </div>

    <!-- Подключаем логику -->
    <script src="app.js"></script>
</body>
</html>
