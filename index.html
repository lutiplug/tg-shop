<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OneMarket Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --hint-color: #888888;
            --btn-color: #ffffff;
            --btn-text: #000000;
            --card-bg: #111111;
            --border-color: #222222;
            --input-bg: #111111;
            --toggle-bg: #1c1c1e;
            --toggle-thumb: #2c2c2e;
        }

        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #666666;
            --btn-color: #000000;
            --btn-text: #ffffff;
            --card-bg: #f4f4f5;
            --border-color: #e4e4e7;
            --input-bg: #f4f4f5;
            --toggle-bg: #e4e4e7;
            --toggle-thumb: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            padding-bottom: 160px;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .theme-switch-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        .theme-toggle {
            position: relative;
            width: 76px;
            height: 38px;
            background: var(--toggle-bg);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 39px;
            width: 32px;
            height: 30px;
            background: var(--toggle-thumb);
            border-radius: 999px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
        }

        body.light-theme .toggle-thumb {
            transform: translateX(-35px);
        }

        .toggle-icon {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--hint-color);
        }

        body:not(.light-theme) .icon-moon { color: #ffffff; }
        body.light-theme .icon-sun { color: #000000; }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--hint-color);
        }

        .search-container { margin-bottom: 14px; }

        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
